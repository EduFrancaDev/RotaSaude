# Ambiente de desenvolvimento. Requer `cp .env.example .env` antes do primeiro uso.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rotasaude}
      POSTGRES_USER: ${POSTGRES_USER:-rotasaude}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Atualização automática dos dados DEMONSTRATIVOS, em processo separado da API (que não
  # depende dele). Com DEMO_AUTO_UPDATE=false, registra isso e sai com código 0.
  # Veja docs/demo-academica.md.
  simulator:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    # Forma exec: o Python é o PID 1 e recebe o SIGTERM do `stop` para encerrar limpo.
    command: ["python", "manage.py", "run_demo_auto_update"]
    restart: on-failure:5
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
