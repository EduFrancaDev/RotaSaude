name: rotasaude
description: "Aplicativo RotaSaúde para consulta de unidades de saúde e planejamento de deslocamento."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/svg/logo-completa/colorida-original.svg
